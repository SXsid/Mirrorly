<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirrorly</title>

    <style>
      * {
        box-sizing: border-box;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        margin: 0;
        padding: 16px;
        width: 320px;
        background: #ffffff;
        color: #111827;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        font-weight: 700;
        color: #c2410c;
      }

      .subtitle {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 14px;
      }

      .status {
        background: #fff7ed;
        border: 1px solid #fed7aa;
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 14px;
        font-size: 13px;
      }

      .status span {
        display: block;
        margin-bottom: 4px;
      }

      .ok {
        color: #15803d;
        font-weight: 600;
      }

      .bad {
        color: #b91c1c;
        font-weight: 600;
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-bottom: 14px;
      }

      .preview {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        background: #f9fafb;
      }

      .preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .empty {
        grid-column: span 3;
        text-align: center;
        font-size: 12px;
        color: #9ca3af;
        padding: 10px 0;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      button {
        flex: 1;
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .primary {
        background: #c2410c;
        color: #ffffff;
      }

      .secondary {
        background: #fff7ed;
        color: #c2410c;
        border: 1px solid #fed7aa;
      }

      .danger {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }

      .footer {
        margin-top: 10px;
        text-align: center;
        font-size: 11px;
        color: #9ca3af;
      }
    </style>

    <script type="module" src="./popup.js" defer></script>
  </head>

  <body>
    <h1>Mirrorly</h1>
    <div class="subtitle">
      AI-powered virtual try-ons for your favorite stores.
    </div>

    <div id="statusBox" class="status"></div>

    <div id="previewGrid" class="preview-grid"></div>
    <div id="referenceGrid" class="preview-grid"></div>

    <div class="actions">
      <button id="generateBtn" class="primary">Generate</button>
      <button id="settingsBtn" class="secondary">Settings</button>
    </div>

    <div class="footer">Mirrorly • v0.1</div>
  </body>
</html>
