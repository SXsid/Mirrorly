<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="" href="./icons//icon32.png" />
    <title>Mirrlry - Options</title>
    <script src="./options/options.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: #ffffff;
        min-height: 100vh;
        padding: 40px 20px;
      }

      .container {
        max-width: 700px;
        margin: 0 auto;
        background: white;
        border: 1px solid #f0f0f0;
        border-radius: 2px;
        padding: 50px;
      }

      h1 {
        color: #000000;
        margin-bottom: 8px;
        font-size: 32px;
        font-weight: 300;
        letter-spacing: -0.5px;
      }

      .subtitle {
        color: #999999;
        margin-bottom: 50px;
        font-size: 14px;
        font-weight: 400;
      }

      .section {
        margin-bottom: 45px;
      }

      .section-title {
        font-size: 12px;
        font-weight: 600;
        color: #000000;
        margin-bottom: 16px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .input-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #666666;
        font-size: 13px;
        font-weight: 500;
      }

      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #e0e0e0;
        border-radius: 0;
        font-size: 14px;
        transition: all 0.2s ease;
        font-family: monospace;
        background: #fafafa;
      }

      input[type="password"]:focus,
      input[type="text"]:focus {
        outline: none;
        border-color: #cc5500;
        background: #ffffff;
      }

      .upload-area {
        border: 2px dashed #e0e0e0;
        border-radius: 0;
        padding: 50px 30px;
        text-align: center;
        background: #fafafa;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .upload-area:hover {
        border-color: #cc5500;
        background: #ffffff;
      }

      .upload-area.dragover {
        border-color: #cc5500;
        background: #fff8f5;
        border-style: solid;
      }

      .upload-icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        background: #cc5500;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 20px;
      }

      .upload-text {
        color: #333333;
        font-size: 15px;
        margin-bottom: 6px;
        font-weight: 500;
      }

      .upload-hint {
        color: #999999;
        font-size: 12px;
      }

      input[type="file"] {
        display: none;
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 25px;
      }

      .preview-item {
        position: relative;
        aspect-ratio: 1;
        border-radius: 0;
        overflow: hidden;
        background: #f5f5f5;
        border: 1px solid #e0e0e0;
      }

      .preview-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .remove-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        background: #cc5500;
        color: white;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 300;
        transition: all 0.2s ease;
        line-height: 1;
      }

      .remove-btn:hover {
        background: #aa4500;
      }

      .button-group {
        display: flex;
        gap: 15px;
        margin-top: 50px;
      }

      button {
        padding: 14px 28px;
        border: none;
        border-radius: 0;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .btn-primary {
        background: #cc5500;
        color: white;
        flex: 1;
      }

      .btn-primary:hover {
        background: #aa4500;
      }

      .btn-primary:active {
        background: #994000;
      }

      .btn-secondary {
        background: transparent;
        color: #666666;
        border: 1px solid #e0e0e0;
      }

      .btn-secondary:hover {
        border-color: #cc5500;
        color: #cc5500;
      }

      .status-message {
        padding: 14px 18px;
        border-radius: 0;
        margin-top: 25px;
        font-size: 13px;
        display: none;
        border-left: 3px solid;
      }

      .status-message.success {
        background: #f0f9f4;
        color: #0d6832;
        border-color: #0d6832;
        display: block;
      }

      .status-message.error {
        background: #fef5f5;
        color: #cc5500;
        border-color: #cc5500;
        display: block;
      }

      .image-count {
        color: #999999;
        font-size: 12px;
        margin-top: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .image-count.max {
        color: #cc5500;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Mirrorly Settings</h1>
      <p class="subtitle">Configure your API key and upload reference images</p>

      <!-- API Key Section -->
      <div class="section">
        <div class="section-title">API Configuration</div>
        <div class="input-group">
          <label for="apiKey">API Key</label>
          <input type="password" id="apiKey" placeholder="Enter your API key" />
        </div>
      </div>

      <!-- Image Upload Section -->
      <div class="section">
        <div class="section-title">Reference Images</div>
        <div class="upload-area" id="uploadArea">
          <div class="upload-icon">+</div>
          <div class="upload-text">Click to upload or drag and drop</div>
          <div class="upload-hint">PNG, JPG, WEBP (Min: 1, Max: 3 images)</div>
          <input type="file" id="fileInput" accept="image/*" multiple />
        </div>
        <div class="image-count" id="imageCount">0 / 3 images uploaded</div>
        <div class="preview-grid" id="previewGrid"></div>
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button class="btn-primary" id="saveBtn">Save Settings</button>
        <button class="btn-secondary" id="resetBtn">Reset</button>
      </div>

      <div class="status-message" id="statusMessage"></div>
    </div>
  </body>
</html>
